[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"


[project]
name = "npDSP"
version = "0.0.5"
requires-python = ">=3.10"
description = "Composable NumPy-based digital signal processing blocks and pipelines"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martijn Hiemstra" }]


keywords = [
    "dsp",
    "digital signal processing",
    "numpy",
    "signal processing",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "numba>=0.66.0",
    "numpy>=2.2.6",
    "typing-extensions>=4.16.0",
]


[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

docs = [
    "sphinx>=8.1.3",
    "sphinx-last-updated-by-git>=0.3.8",
    "sphinx-prompt>=1.9.0",
    "sphinx-rtd-theme>=3.1.0",
]


[project.urls]
Documentation = "https://npdsp.readthedocs.io/"
Repository = "https://github.com/mrhiemstra/npDSP"
Issues = "https://github.com/mrhiemstra/npDSP/issues"
