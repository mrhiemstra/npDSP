[build-system]
requires = ["uv_build>=0.12.0, <0.13"]
build-backend = "uv_build"

[project]
name = "npDSP"
version = "0.0.1"
requires-python = ">=3.10"
description = "Composable NumPy-based digital signal processing blocks and pipelines"
readme = "README.md"
authors = [{name="Martijn Hiemstra"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.2.6",
    "si-prefix>=1.3.3",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
]

[project.urls]
Documentation = "https://npDSP.readthedocs.org"
Repository = "https://github.com/mrhiemstra/npDSP.git"