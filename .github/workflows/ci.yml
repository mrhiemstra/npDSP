name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:

  lock_file:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup
      - run: uv lock --check


  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: lock_file
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check .

  format:
    name: format
    runs-on: ubuntu-latest
    needs: lock_file
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

  typecheck:
    name: Pyright
    runs-on: ubuntu-latest
    needs: lock_file
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Pyright
        run: uv run --locked pyright .
  
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint, format, typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest test --benchmark-skip --cov

      - name: Run benchmarks
        if: github.ref_type == 'tag'
        run: uv run --python ${{ matrix.python-version }} pytest test --benchmark-only

    
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --group docs --python 3.14

      - name: Build documentation
        run: uv run --python 3.14 sphinx-build -W -b html docs/source docs/build/html

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup

      - name: Build package
        run: uv build