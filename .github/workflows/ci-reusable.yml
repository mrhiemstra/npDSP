name: CI

on:
  workflow_call

permissions:
  contents: read

jobs:
  lock_file:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1    

      - uses: ./.github/actions/setup
      - run: uv lock --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check .

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

  typecheck:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Pyright
        run: uv run --locked pyright .
  
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint, format, typecheck, lock_file]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - uses: ./.github/actions/setup

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest test --benchmark-skip -n auto

      - name: Run benchmarks
        if: github.ref_type == 'tag'
        run: uv run --python ${{ matrix.python-version }} pytest test --benchmark-only
  
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, lock_file]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - uses: ./.github/actions/setup

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --python 3.14

      - name: Run tests
        run: uv run --python 3.14 pytest test --cov=src/npdsp --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage and test results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

          
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, lock_file]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - uses: ./.github/actions/setup

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --group docs --python 3.14

      - name: Build documentation
        run: uv run --python 3.14 sphinx-build -W -b html docs/source docs/build/html

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, lock_file]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - uses: ./.github/actions/setup

      - name: Set up Python
        run: uv python install 3.14
        
      - name: Build package
        run: uv build

      - name: Test built wheel
        run: |
          uv venv /tmp/test-wheel-env --python 3.14
          uv pip install --python /tmp/test-wheel-env ${{ github.workspace }}/dist/*.whl
          /tmp/test-wheel-env/bin/python -c "import npdsp; print('npdsp successfully installed from wheel')" 

      - name: Test built sdist
        run: |
          uv venv /tmp/test-sdist-env --python 3.14
          uv pip install --python /tmp/test-sdist-env ${{ github.workspace }}/dist/*.tar.gz
          /tmp/test-sdist-env/bin/python -c "import npdsp; print('npdsp successfully installed from sdist')"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: npdsp-dist
          path: dist/
          if-no-files-found: error